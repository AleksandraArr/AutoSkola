name: Testovi

on:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Podesi .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pokreni testove
        run: dotnet test Tests/Tests.csproj
